name: Build APK

on:
  push:
    branches:
      - ceb/fix-msvc-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;26.1.10909125"

      - name: Download Gemma 2B model
        run: |
          mkdir -p examples/llama.android/app/src/main/assets
          curl -L -o examples/llama.android/app/src/main/assets/gemma-2b.gguf \
            https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf

      - name: Grant execute permission for gradlew
        run: chmod +x examples/llama.android/gradlew

      - name: Build APK
        working-directory: examples/llama.android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistant-ia-local-apk
          path: examples/llama.android/app/build/outputs/apk/debug/*.apk
